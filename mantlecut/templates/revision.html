<header class="heading">
  <div><p class="eyebrow">版本 <code>#$revision</code></p><h1>$title</h1></div>
  <div class="meta">$state <span class="muted">编辑代数 $generation</span></div>
</header>
<div class="workspace">
  <section class="panel stack">
    <h2>配置文档</h2>
    $editor
    <div class="actions">$actions</div>
  </section>
  <aside class="stack">
    <section class="panel stack"><h2>按订阅端预览</h2>$preview_form $preview</section>
    <section class="panel"><div class="section-head"><h2>协议预检</h2><span class="muted">已检查 $checked 端</span></div>$compatibility</section>
  </aside>
</div>
