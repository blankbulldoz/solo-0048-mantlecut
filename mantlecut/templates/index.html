<header class="heading">
  <div><p class="eyebrow">配置分发</p><h1>配置线</h1></div>
  <a class="button" href="#new-line">新建配置线</a>
</header>
<div class="workspace">
  <section class="stack" aria-label="现有配置线">$tiles</section>
  <aside class="panel" id="new-line">
    <h2>新建配置线</h2>
    <form method="post" action="/lines" class="stack">
      <input type="hidden" name="_token" value="$token">
      <label>显示名称<input name="title" maxlength="60" required></label>
      <label>配置线 ID<input name="slug" pattern="[a-z][a-z0-9\-]{0,47}" placeholder="carbon-ridge" required></label>
      <button class="primary">创建配置线</button>
    </form>
  </aside>
</div>
